<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Editor - Gling UI Clone</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Usamos la tipografía Inter para un aspecto moderno y limpio -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- PANEL IZQUIERDO: Transcripción y Archivos -->
        <aside class="panel left-panel">
            <div class="tabs">
                <button class="tab active">Script</button>
                <button class="tab">Files</button>
            </div>
            
            <!-- Zona de Subida de Archivos -->
            <div class="upload-section" id="uploadSection">
                <p style="margin-bottom: 15px; font-size: 14px; color: var(--text-muted);">Sube tu video para generar la transcripción automática.</p>
                <input type="file" id="videoInput" accept="video/mp4,video/x-m4v,video/*">
                <button id="uploadBtn" class="btn primary">Subir y Analizar Video</button>
                <div id="uploadStatus"></div>
            </div>

            <!-- Contenedor del Texto Sincronizado -->
            <div class="transcript-container" id="transcriptContainer" style="display: none;">
                <!-- Los segmentos del transcript se inyectarán aquí dinámicamente -->
            </div>
            
            <!-- Botón de Exportación -->
            <div class="export-section">
                <button id="exportBtn" class="btn secondary" disabled>Exportar Edición</button>
            </div>
        </aside>

        <!-- PANEL DERECHO: Reproductor de Video -->
        <main class="panel right-panel">
            <div class="video-container">
                <video id="player" controls controlsList="nodownload"></video>
            </div>
        </main>
    </div>

    <!-- PANEL INFERIOR: Línea de tiempo y Controles -->
    <footer class="bottom-panel">
        <div class="controls-toolbar">
            <button class="btn icon-btn" id="playPauseBtn">▶</button>
            
            <div class="control-group">
                <label>Velocidad:</label>
                <select id="speedSelect">
                    <option value="1">1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2.0x</option>
                </select>
            </div>

            <!-- Toggle para Omitir Cortes en Tiempo Real -->
            <div class="control-group toggle-group">
                <label for="skipCutsToggle" title="Salta las partes cortadas durante la reproducción">Skip Cuts</label>
                <label class="switch">
                    <input type="checkbox" id="skipCutsToggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            
            <div class="control-group">
                <button class="btn" id="splitBtn" disabled>✂ Cortar</button>
            </div>
            
            <div class="control-group zoom-group">
                <label>Zoom</label>
                <input type="range" id="zoomRange" min="1" max="10" value="1">
            </div>
        </div>
        
        <!-- Línea de Tiempo Interactiva -->
        <div class="timeline-container" id="timelineContainer">
            <div class="timeline-track" id="timelineTrack">
                <!-- Bloques proporcionales a los segmentos irán aquí -->
            </div>
            <!-- Indicador de Tiempo (Playhead) -->
            <div class="playhead" id="playhead"></div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
